[project]
name = "cliente-correo-gigachad"
version = "0.1.0"
description = "Cliente de correo electrónico con soporte IMAP, POP3, SMTP, almacenamiento offline y cifrado simétrico."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Juan Daniel Moreno" },
    { name = "Juan Felipe Rojas" },
    { name = "Sebastián Pérez" }

]

dependencies = [
    "flet>=0.86.5",
    "cryptography>=46.0.0",
    "beautifulsoup4>=4.13.0",
    "markdownify>=1.2.0",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    "flet[test]>=0.86.5",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
desktop_flavor = "light"
org = "com.cliente.correo"
product = "Cliente de Correo"
company = "Proyecto Redes"

[tool.flet.app]
path = "src"